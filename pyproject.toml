[project]
name = "mxproc"
dynamic = ["version"]
license = "MIT"
description = "MX Automated Data Processing Pipeline"
readme = "README.md"
keywords = ["Data Processing Pipeline", "MX", "AutoProcess"]
authors = [
    {name = "Michel Fodje", email = "michel.fodje@lightsource.ca" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mxio",
    "parsefire (>=2026.7.1)",
    "matplotlib",
    "numpy",
    "pyyaml",
    "tqdm",
    "pandas",
    "prettytable",
    "vg",
    "scipy",
    "plotille"
]
requires-python = ">=3.10,<4.0"


[project.urls]
Homepage = "https://github.com/michel4j/mxproc"
Issues = "https://github.com/michel4j/mxproc/issues"
version = "0.0.0"

[project.scripts]
"auto.init" = "mxproc.scripts:auto_init"
"auto.xds" = "mxproc.scripts:auto_xds"
"auto.index" = "mxproc.scripts:auto_index"
"auto.spots" = "mxproc.scripts:auto_spots"
"auto.integrate" = "mxproc.scripts:auto_integrate"
"auto.process" = "mxproc.scripts:auto_process"
"auto.scale" = "mxproc.scripts:auto_scale"
"auto.strategy" = "mxproc.scripts:auto_strategy"
"auto.symmetry" = "mxproc.scripts:auto_symmetry"
"auto.signal" = "mxproc.programs.dozor:process_signal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/mxproc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440" # Options: "pep440", "semver", "pvp"
fallback-version = "0.0.0" # Used if building outside a Git repo (e.g., from an sdist)
format = "{base}.{revision}{distance}"